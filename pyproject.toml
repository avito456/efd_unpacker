[project]
name = "efd-unpacker"
version = "0.1.0"
description = "Cross-platform EFD (Enterprise File Distribution) unpacker"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "onec-dtools==0.5.0",
    "PyQt5==5.15.11",
]

[tool.uv.sources]
onec-dtools = { path = "vendor/onec-dtools" }

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-qt>=4.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src"]
qt_api = "pyqt5"
